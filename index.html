#header .logo{font-size:17px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:7px}
#header .logo .icon{width:32px;height:32px;background:linear-gradient(135deg,#38bdf8,#6366f1);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px}

#header .date-group{display:flex;gap:6px;align-items:center;margin-left:14px}
#header .date-group select{padding:5px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:12px;cursor:pointer;outline:none}
#header .date-group select option{color:#1e293b;background:#fff}
#header .q-btn{padding:5px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:12px;cursor:pointer;transition:.15s;white-space:nowrap}
#header .q-btn:hover{background:rgba(255,255,255,.18)}
#header .q-btn.sel{background:var(--pri);border-color:var(--pri);font-weight:600}
.kpi-row{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.kpi-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:var(--r);padding:8px 12px;min-width:105px;text-align:center;transition:.2s;cursor:default}
.kpi-card:hover{background:rgba(255,255,255,.13)}.kpi-card .kpi-val{font-size:18px;font-weight:700}
.kpi-card .kpi-label{font-size:10px;color:rgba(255,255,255,.55);margin-top:1px}
.kpi-card.up .kpi-val{color:#4ade80}.kpi-card.down .kpi-val{color:#f87171}
#sidebar{position:fixed;left:0;top:var(--hh);bottom:0;width:var(--sw);background:var(--card);border-right:1px solid var(--bd);overflow-y:auto;z-index:90;padding:6px 0;box-shadow:var(--sh)}
.sec-label{padding:8px 14px 3px;font-size:13px;color:var(--text);font-weight:700;letter-spacing:.5px}
.side-btn{display:flex;align-items:center;gap:8px;width:100%;padding:9px 14px;border:none;background:transparent;cursor:pointer;font-size:12px;color:var(--text);transition:.15s;text-align:left;border-left:3px solid transparent}
.side-btn:hover{background:#f1f5f9}.side-btn.active{background:#eff6ff;color:var(--pri);border-left-color:var(--pri);font-weight:600}
.side-btn .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}.side-btn .tip{font-size:9px;color:var(--tx2);margin-left:auto}
.mode-switch{padding:9px 14px;margin:6px 10px;border-radius:6px;background:#f8fafc;font-size:11px;color:var(--tx2);display:flex;align-items:center;gap:6px;cursor:pointer;border:1px solid var(--bd);transition:.15s}
.mode-switch:hover{background:#f1f5f9}.mode-switch input{cursor:pointer}
#main{position:fixed;left:var(--sw);top:var(--hh);right:0;bottom:0;overflow-y:auto;padding:8px}
#main.single{display:flex;flex-direction:column}
#main.multi{display:grid;grid-template-columns:repeat(auto-fill,minmax(500px,1fr));gap:8px;align-content:start}
#main.multi.n2{grid-template-columns:repeat(2,1fr)}
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;min-height:550px;animation:fadeIn .25s ease}

.panel-hd{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--bd);background:#fafbfc;flex-shrink:0}
.panel-hd h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:5px}
.panel-ctls button{border:none;background:transparent;cursor:pointer;font-size:16px;padding:1px 6px;border-radius:4px;color:var(--tx2);transition:.15s}
.panel-ctls button:hover{background:#e2e8f0;color:var(--text)}
.panel-body{flex:1;position:relative;min-height:480px;overflow:hidden}
.panel-body>.chart-wrap{position:absolute;top:0;left:0;right:0;bottom:0}
.col2-layout{display:flex;gap:10px;padding:10px;position:relative;min-height:500px}
.col2-layout>.chart-wrap{flex:1;position:relative;min-width:0;min-height:100%}
.col2-layout>.emp-sidebar{width:300px;flex-shrink:0;overflow-y:auto;border-right:1px solid var(--bd);display:flex;flex-direction:column}
.col2-layout>.emp-main{flex:1;position:relative;min-height:480px}
.col2-layout>.emp-main>.chart-wrap{position:absolute;top:0;left:0;right:0;bottom:0}
.dept-tabs{display:flex;gap:4px;padding:6px 10px;flex-wrap:wrap;border-bottom:1px solid var(--bd);flex-shrink:0}

.dept-tab:hover{background:#f1f5f9;color:var(--text)}.dept-tab.sel{background:var(--pri);color:#fff;border-color:var(--pri)}

.emp-item{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px;border-radius:8px;transition:.15s}

function getMonthRange(q){
  if(q==='0')return[0,11];
  if(q==='1')return[0,2];
  if(q==='2')return[3,5];
  if(q==='3')return[6,8];
  if(q==='4')return[9,11];
  if(q==='h1')return[0,5];
  if(q==='h2')return[6,11];
  return[0,11];
}

    xAxis:{type:'category',data:qt,axisLabel:{fontSize:10}},
    yAxis:{type:'value',name:'万元',axisLabel:{fontSize:9}},
    series:[{type:'line',data:v,smooth:true,symbol:'circle',symbolSize:10,lineStyle:{width:3,color:'#84cc16'},itemStyle:{color:'#84cc16',borderColor:'#fff',borderWidth:2},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(132,204,22,.3)'},{offset:1,color:'rgba(132,204,22,0)'}])},label:{show:true,fontSize:10,formatter:p=>'¥'+p.value+'万'}}]
  });
}
// Product Detail (categories)
let prodCat='膜元件';
function renderProdDetail(ctn){
  let tabs=Object.keys(R_PROD_CAT).map(c=>`<span class="dept-tab${c===prodCat?' sel':''}" onclick="switchProdCat('${c}')">${c} (¥${(R_PROD_CAT[c].t/10000).toFixed(3)}亿)</span>`).join('');
  ctn.innerHTML=`<div class="panel"><div class="panel-hd"><h3>产品分类详情 (25年实际)</h3><div class="panel-ctls"><button onclick="closePanel('proddetail')">✕</button></div></div><div class="dept-tabs" id="prodCatTabs">${tabs}</div><div class="panel-body col2-layout"><div class="chart-wrap" id="prodSubChart"></div><div class="chart-wrap" id="prodCatLineChart"></div></div></div>`;
  setTimeout(()=>renderProdCat(),100);
}
function switchProdCat(c){prodCat=c;document.querySelectorAll('#prodCatTabs .dept-tab').forEach(t=>t.classList.toggle('sel',t.textContent.startsWith(c)));renderProdCat();}
function renderProdCat(){
  let c1=getChart('prodSubChart'),c2=getChart('prodCatLineChart');if(!c1||!c2)return;
  let cd=R_PROD_CAT[prodCat],subs=cd.subs.slice().sort((a,b)=>b.t-a.t).reverse();
  c1.setOption({
    title:{text:prodCat+' 分类产品排行',left:'center',top:2,textStyle:{fontSize:12}},
    tooltip:{trigger:'axis',formatter:ps=>{let d=subs[ps[0].dataIndex];let vt=d.t>=1?'¥'+d.t+'万':'¥'+Math.round(d.t*10000)+'元';return`<b>${d.n}</b><br/>总计:${vt}`;}},
    grid:{left:'22%',right:'14%',top:'10%',bottom:'6%',containLabel:true},
    xAxis:{type:'value',name:'万元',axisLabel:{fontSize:10}},
    yAxis:{type:'category',data:subs.map(d=>d.n),axisLabel:{fontSize:9}},
    series:[{type:'bar',data:subs.map(d=>({value:d.t,itemStyle:{color:'#d946ef',borderRadius:[0,4,4,0]}})),barWidth:'55%',label:{show:true,position:'right',formatter:p=>p.value>=1?'¥'+p.value+'万':'¥'+Math.round(p.value*10000)+'元',fontSize:9}}]
  });
  let qt=['Q1','Q2','Q3','Q4'],v=qt.map(q=>cd.q[q]||0);
  c2.setOption({
    title:{text:prodCat+' 季度销售额趋势',left:'center',top:2,textStyle:{fontSize:12}},
    tooltip:{trigger:'axis',formatter:ps=>ps[0].name+':<b>¥'+ps[0].value+'万</b>'},
    grid:{left:'14%',right:'8%',bottom:'10%',top:'14%',containLabel:true},
    xAxis:{type:'category',data:qt,axisLabel:{fontSize:10}},
    yAxis:{type:'value',name:'万元',axisLabel:{fontSize:9}},
    series:[{type:'line',data:v,smooth:true,symbol:'circle',symbolSize:10,lineStyle:{width:3,color:'#d946ef'},itemStyle:{color:'#d946ef',borderColor:'#fff',borderWidth:2},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(217,70,239,.3)'},{offset:1,color:'rgba(217,70,239,0)'}])},label:{show:true,fontSize:10,formatter:p=>'¥'+p.value+'万'}}]
  });
  // Click sub to show its quarterly
  c1.off('click');c1.on('click',function(p){if(p.name){let d=subs.find(dd=>dd.n===p.name);if(d){let qt2=['Q1','Q2','Q3','Q4'],v2=qt2.map(q=>d.q[q]||0);c2.setOption({title:{text:d.n+' · 季度销售额',left:'center',top:2,textStyle:{fontSize:12}},tooltip:{trigger:'axis',formatter:ps=>ps[0].name+':<b>¥'+ps[0].value+'万</b>'},grid:{left:'14%',right:'8%',bottom:'10%',top:'14%',containLabel:true},xAxis:{type:'category',data:qt2,axisLabel:{fontSize:10}},yAxis:{type:'value',name:'万元',axisLabel:{fontSize:9}},series:[{type:'line',data:v2,smooth:true,symbol:'circle',symbolSize:10,lineStyle:{width:3,color:'#f59e0b'},itemStyle:{color:'#f59e0b',borderColor:'#fff',borderWidth:2},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(245,158,11,.3)'},{offset:1,color:'rgba(245,158,11,0)'}])},label:{show:true,fontSize:10,formatter:p=>'¥'+p.value+'万'}}]});}}});}

// Navigate
const renderers={'china':renderChina,'world':renderWorld,'sales':renderSales,'employee':renderEmployee,'purchase':renderPurchase,'pareto':renderPareto,'catcust':renderCatCust,'emp-profile':renderEmpProfile,'prodover':renderProdOver,'proddetail':renderProdDetail};
function openPanel(pageId){if(!multiMode){activePanels.clear();}activePanels.add(pageId);updateSidebar();refreshMain();}
function closePanel(pageId){activePanels.delete(pageId);updateSidebar();if(activePanels.size===0){activePanels.add('china');updateSidebar();}refreshMain();}
function updateSidebar(){document.querySelectorAll('.side-btn').forEach(b=>b.classList.toggle('active',activePanels.has(b.dataset.page)));}
function refreshMain(){let main=document.getElementById('main');main.querySelectorAll('.chart-wrap').forEach(el=>{let c=echarts.getInstanceByDom(el);if(c)c.dispose();});main.innerHTML='';let sz=activePanels.size;if(sz===1&&!multiMode)main.className='single';else{main.className='multi';if(sz===2)main.classList.add('n2');}[...activePanels].forEach(pageId=>{let wrapper=document.createElement('div');main.appendChild(wrapper);renderers[pageId](wrapper);});}

// Init
document.getElementById('multiMode').addEventListener('change',function(){multiMode=this.checked;if(!multiMode&&activePanels.size>1){activePanels.clear();activePanels.add('china');updateSidebar();}refreshMain();});
document.querySelectorAll('.side-btn').forEach(btn=>{btn.addEventListener('click',function(){let pageId=this.dataset.page;if(!multiMode){if(activePanels.has(pageId)&&activePanels.size===1)return;}else{if(activePanels.has(pageId)){closePanel(pageId);return;}}openPanel(pageId);});});
document.getElementById('selYear').addEventListener('change',renderKPI);document.getElementById('selMonth').addEventListener('change',renderKPI);
document.querySelectorAll('.q-btn').forEach(btn=>{btn.addEventListener('click',function(){document.querySelectorAll('.q-btn').forEach(b=>b.classList.remove('sel'));this.classList.add('sel');currentQuarter=this.dataset.q;renderKPI();refreshMain();let labels={0:'全年',1:'Q1',2:'Q2',3:'Q3',4:'Q4',h1:'上半年',h2:'下半年'};toast('已切换至 '+labels[this.dataset.q]+' 视图');});});
loadChinaMap(()=>{});renderKPI();refreshMain();
</script>
