<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球市场数据监控</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap');
:root{--bg-deep:#061126;--glass:rgba(6,20,50,.65);--cyan:#00E5FF;--blue:#2979FF;--purple:#7C4DFF;--border-glow:rgba(0,229,255,.25);--text:#c8d6e5;--text-dim:#5a6f8a;--success:#00e676}
*{margin:0;padding:0;box-sizing:border-box}
body{width:100vw;height:100vh;overflow:hidden;background:var(--bg-deep);font-family:'Orbitron','Microsoft YaHei','PingFang SC',sans-serif;color:var(--text);position:relative}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background-image:linear-gradient(rgba(0,229,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.03) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:0}
body::after{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0px,rgba(0,0,0,.12) 1px,transparent 1px,transparent 3px);pointer-events:none;z-index:999;opacity:.3}
#app{position:relative;z-index:1;width:100%;height:100%;display:flex;gap:12px;padding:8px 12px}
#left-col{width:480px;flex-shrink:0;display:flex;flex-direction:column;gap:6px}
#panel-monthly{flex:144}#panel-dept{flex:144}#panel-countries{flex:8;min-height:240px}
#right-col{flex:1;display:flex;flex-direction:column;gap:10px}
#kpi-row{display:flex;gap:8px;padding:0;flex-shrink:0}
.kpi-card{flex:1;background:var(--glass);border:1px solid var(--border-glow);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:14px 0;backdrop-filter:blur(8px)}
.kpi-card::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:1.5px;background:linear-gradient(90deg,transparent,var(--cyan),transparent)}
.kpi-val{font-size:20px;font-weight:900;color:#fff;text-shadow:0 0 10px rgba(0,229,255,.5);letter-spacing:1px}
.kpi-label{font-size:9px;color:var(--text-dim);margin-top:2px;letter-spacing:1px}
.panel{background:var(--glass);border:1px solid var(--border-glow);border-radius:8px;position:relative;overflow:hidden;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column}
.panel::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.6}
.panel::after{content:'';position:absolute;bottom:0;right:0;width:20px;height:20px;border-right:2px solid var(--border-glow);border-bottom:2px solid var(--border-glow);opacity:.5}
.panel-hd{display:flex;align-items:center;gap:8px;padding:8px 12px 5px;font-size:12px;font-weight:600;color:var(--cyan);letter-spacing:1.5px;flex-shrink:0}
.panel-hd .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan),0 0 16px var(--cyan);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.panel-body{flex:1;position:relative;overflow:hidden}
#panel-map{flex:1}
.rank-list{padding:6px 12px 12px}
.rank-item{display:flex;align-items:center;gap:10px;padding:6px 8px;margin-bottom:3px;border-radius:4px;background:rgba(0,229,255,.03);transition:.2s}
.rank-item:hover{background:rgba(0,229,255,.08)}
.rank-badge{width:26px;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff}
.rank-badge.gold{background:linear-gradient(135deg,#ffd700,#ff8c00)}.rank-badge.silver{background:linear-gradient(135deg,#c0c0c0,#8a8a8a)}.rank-badge.bronze{background:linear-gradient(135deg,#cd7f32,#a0522d)}.rank-badge.normal{background:rgba(0,229,255,.2);color:var(--cyan)}
.rank-name{flex:1;font-size:12px;color:#e8edf5}
.rank-pct{font-size:12px;font-weight:700;color:var(--cyan);text-shadow:0 0 6px rgba(0,229,255,.3)}
.rank-bar-wrap{width:90px;height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.rank-bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--cyan),var(--blue))}
</style>
</head>
<body>
<div id="app">
  <div id="left-col">
    <div class="panel" id="panel-monthly">
      <div class="panel-hd"><span class="dot"></span>25年海外月度销售额</div>
      <div class="panel-body"><div id="chart-monthly" style="width:100%;height:100%;"></div></div>
    </div>
    <div class="panel" id="panel-dept">
      <div class="panel-hd"><span class="dot"></span>主要国家/港澳台月度销售额 (2025)</div>
      <div class="panel-body"><div id="chart-ctry" style="width:100%;height:100%;"></div></div>
    </div>
    <div class="panel" id="panel-countries">
      <div class="panel-hd"><span class="dot"></span>国家/港澳台销售额排行 TOP 6</div>
      <div class="panel-body"><div class="rank-list" id="rank-list"></div></div>
    </div>
  </div>
  <div id="right-col">
    <div id="kpi-row">
      <div class="kpi-card"><div class="kpi-val">¥<span id="kv-total"></span>万</div><div class="kpi-label">海外总销售额</div></div>
      <div class="kpi-card"><div class="kpi-val">¥<span id="kv-avg"></span>万</div><div class="kpi-label">月均销售额</div></div>
      <div class="kpi-card"><div class="kpi-val" id="kv-cnt"></div><div class="kpi-label">覆盖国家/地区数</div></div>
      <div class="kpi-card"><div class="kpi-val" id="kv-ratio"></div><div class="kpi-label">海外占比</div></div>
    </div>
    <div class="panel" id="panel-map">
      <div class="panel-hd"><span class="dot"></span>全球各洲销售额分布</div>
      <div class="panel-body"><div id="chart-cont" style="width:100%;height:100%;"></div></div>
    </div>
  </div>
</div>
<script>
const OVS_MONTHLY=[235.9,211.4,399.6,347.7,506.3,245.1,545.7,572.9,378.3,290.2,640.4,463.9];
const OVS_COUNTRIES=[{"n":"印度","t":1656.7},{"n":"土耳其","t":712.1},{"n":"台湾","t":576.4},{"n":"英国","t":372.1},{"n":"韩国","t":347.2},{"n":"比利时","t":210.6}];
const OVS_CONTINENT=[{"name":"Asia","value":3476},{"name":"Europe","value":1004},{"name":"North America","value":11},{"name":"South America","value":4},{"name":"其他","value":342}];
const OVS_TOTAL=4837.3,OVS_AVG=403.1,TOTAL_ALL=54376;
const OVS_CTRY_BAR={"印度":{"name":"印度","data":[16.4,0,194.9,131.9,260.7,15.6,196.3,233.4,33.4,224.7,177.4,172],"total":1656.7},"土耳其":{"name":"土耳其","data":[118.2,0,0,0,114.5,0,100.8,153.9,109.1,0,115.7,0],"total":712.1},"台湾":{"name":"台湾","data":[0,58.8,57.3,130.1,0,56.6,0,0,56.1,54.6,56.6,106.4],"total":576.4},"英国":{"name":"英国","data":[0,57.7,63.3,0.1,5.6,29.5,61.7,22.8,63.4,9.9,58.1,0],"total":372.1},"韩国":{"name":"韩国","data":[0.6,83.8,31.5,0,0,41.9,28.3,65.8,12.4,0.9,41.3,40.6],"total":347.2}};
const months=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

// KPI
document.getElementById('kv-total').textContent=OVS_TOTAL.toFixed(0);
document.getElementById('kv-avg').textContent=OVS_AVG.toFixed(0);
document.getElementById('kv-cnt').textContent='20国';
document.getElementById('kv-ratio').textContent=(OVS_TOTAL/TOTAL_ALL*100).toFixed(1)+'%';

// Module 1: Monthly line
(function(){
  var c=echarts.init(document.getElementById('chart-monthly'));
  c.setOption({
    tooltip:{trigger:'axis',backgroundColor:'rgba(6,20,50,.9)',borderColor:'#00E5FF',textStyle:{color:'#c8d6e5',fontSize:11}},
    legend:{right:6,top:2,textStyle:{color:'#5a6f8a',fontSize:10},data:['海外销售额']},
    grid:{left:52,right:14,top:40,bottom:40},
    xAxis:{type:'category',data:months,axisLine:{lineStyle:{color:'rgba(0,229,255,.2)'}},axisLabel:{color:'#5a6f8a',fontSize:11},axisTick:{show:false}},
    yAxis:{type:'value',name:'万元',nameTextStyle:{color:'#5a6f8a',fontSize:11},splitLine:{lineStyle:{color:'rgba(0,229,255,.06)'}},axisLabel:{color:'#5a6f8a',fontSize:11,margin:12}},
    series:[{name:'海外销售额',type:'line',data:OVS_MONTHLY,smooth:true,symbol:'circle',symbolSize:7,lineStyle:{width:3,shadowBlur:10,shadowColor:'rgba(0,229,255,.5)'},itemStyle:{color:'#00E5FF',borderColor:'#fff',borderWidth:2},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(0,229,255,.3)'},{offset:1,color:'rgba(0,229,255,0)'}])}}]
  });
})();

// Module 2: Country stacked bar
(function(){
  var c=echarts.init(document.getElementById('chart-ctry'));
  var countries=['印度','土耳其','台湾','英国','韩国'];
  var colors=['#00E5FF','#2979FF','#7C4DFF','#FF6D00','#00E676'];
  var series=countries.map(function(d,i){return{name:d,type:'bar',stack:'total',data:OVS_CTRY_BAR[d].data,itemStyle:{color:colors[i]},barWidth:'55%'};});
  c.setOption({
    tooltip:{trigger:'axis',backgroundColor:'rgba(6,20,50,.9)',borderColor:'#00E5FF',textStyle:{color:'#c8d6e5',fontSize:11}},
    legend:{bottom:2,textStyle:{color:'#5a6f8a',fontSize:9},itemWidth:10,itemHeight:8},
    grid:{left:42,right:10,top:18,bottom:48},
    xAxis:{type:'category',data:months,axisLine:{lineStyle:{color:'rgba(0,229,255,.2)'}},axisLabel:{color:'#5a6f8a',fontSize:10}},
    yAxis:{type:'value',name:'万元',nameTextStyle:{color:'#5a6f8a',fontSize:11},splitLine:{lineStyle:{color:'rgba(0,229,255,.06)'}},axisLabel:{color:'#5a6f8a',fontSize:11,margin:12}},
    series:series
  });
})();

// Module 3: Countries ranking
(function(){
  var html='';
  OVS_COUNTRIES.forEach(function(c,i){
    var cls=i===0?'gold':i===1?'silver':i===2?'bronze':'normal';
    html+='<div class="rank-item"><div class="rank-badge '+cls+'">NO.'+(i+1)+'</div><span class="rank-name">'+c.n+'</span><div class="rank-bar-wrap"><div class="rank-bar-fill" style="width:'+Math.min(c.t/1656.7*70,100)+'%"></div></div><span class="rank-pct">¥'+c.t+'万</span></div>';
  });
  document.getElementById('rank-list').innerHTML=html;
})();

// Module 4: Continent distribution
(function(){
  var c=echarts.init(document.getElementById('chart-cont'));
  var conts=OVS_CONTINENT.sort(function(a,b){return b.value-a.value;});
  var names=conts.map(function(d){return d.name;}).reverse();
  var vals=conts.map(function(d){return d.value;}).reverse();
  c.setOption({
    title:{text:'各洲销售额 (万元)',left:'center',top:2,textStyle:{fontSize:12}},
    tooltip:{trigger:'axis',formatter:function(ps){return'<b>'+ps[0].name+'</b><br/> ¥'+ps[0].value+'万';}},
    grid:{left:'24%',right:'14%',top:'14%',bottom:'6%',containLabel:true},
    xAxis:{type:'value',name:'万元',axisLabel:{fontSize:10}},
    yAxis:{type:'category',data:names,axisLabel:{fontSize:11}},
    series:[{type:'bar',data:vals,itemStyle:{color:'#86efac'},barWidth:'55%',label:{show:true,position:'right',formatter:function(p){return'¥'+p.value+'万';},fontSize:10,color:'#fff'}}]
  });
})();
</script>
</body>
</html>
